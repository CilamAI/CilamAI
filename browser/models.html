<ul class="space-y-4" id="models-list">

<script>
  // Filter functionality
  const filterButtons = document.querySelectorAll('.filter-btn');
  const modelItems = document.querySelectorAll('.model-item');
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const filter = btn.getAttribute('data-filter');
      filterButtons.forEach(b => b.classList.remove('bg-black', 'text-white', 'dark:bg-white', 'dark:text-gray-900'));
      filterButtons.forEach(b => b.classList.add('bg-gray-100', 'text-gray-700', 'dark:bg-[#111111]', 'dark:text-gray-300'));
      btn.classList.remove('bg-gray-100', 'text-gray-700', 'dark:bg-[#111111]', 'dark:text-gray-300');
      btn.classList.add('bg-black', 'text-white', 'dark:bg-white', 'dark:text-gray-900');
      modelItems.forEach(item => {
        if (filter === 'all' || item.dataset.category === filter) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    });
  });
  // Sort placeholder
  document.getElementById('sort-select').addEventListener('change', (e) => {
    // Future sorting logic
  });
</script>

    </main>

    <script>
        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-sun')?.classList.remove('hidden');
                document.getElementById('theme-moon')?.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-sun')?.classList.add('hidden');
                document.getElementById('theme-moon')?.classList.remove('hidden');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('cilamai-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
            applyTheme(isDark);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('cilamai-theme', newTheme);
            applyTheme(!isDark);
        }

        initTheme();
    </script>
