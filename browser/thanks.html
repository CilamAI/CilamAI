<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Downloading CilamAI Desktop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="bg-white dark:bg-black text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="relative flex items-center justify-between px-6 py-4 max-w-[1440px] mx-auto w-full">
        <!-- Left: Logo and Links -->
        <div class="flex items-center gap-8">
            <a href="desktop.html" class="flex items-center gap-2">
                <img src="https://file.garden/aPSLaf7myCkWreuK/Untitled_design__9_-removebg-preview.png" alt="CilamAI Logo" class="w-8 h-8 object-contain">
                <span class="font-bold text-lg text-gray-900 dark:text-white">CilamAI</span>
            </a>
            <div class="hidden md:flex gap-6 text-sm font-medium text-gray-700 dark:text-gray-300">
                <a href="models.html" class="hover:text-black dark:hover:text-white transition-colors">Models</a>
                <a href="docs.html" class="hover:text-black dark:hover:text-white transition-colors">Docs</a>
            </div>
        </div>


        <!-- Right: Theme & Action -->
        <div class="flex items-center gap-3">
            <a href="https://github.com/CilamAI/CilamAI" target="_blank" rel="noopener noreferrer" class="p-2 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-[#111111] focus:outline-none" title="GitHub Repository">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>
            </a>
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="p-2 text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none" title="Toggle Dark/Light Mode">
                <!-- Sun Icon -->
                <svg id="theme-sun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Moon Icon -->
                <svg id="theme-moon" class="w-5 h-5 block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Thank You Container -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-16 text-center max-w-3xl mx-auto w-full">
        
        <!-- Checkmark Badge -->
        <div class="mb-6 text-green-600 animate-pop">
            <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>

        <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white mb-3">Thank you for downloading CilamAI!</h1>
        <p class="text-gray-600 dark:text-gray-300 text-base sm:text-lg mb-8 max-w-xl">
            Your installer download should begin automatically. If it didn't start, click the manual link below.
        </p>

        <!-- Direct Manual Link -->
        <a href="https://github.com/CilamAI/CilamAI/releases/latest/download/CilamAI-Setup.exe" 
           class="inline-flex items-center gap-3 bg-[#1c1c1c] dark:bg-black border border-transparent dark:border-[#222222] text-white px-7 py-3.5 rounded-full text-sm font-semibold hover:bg-black transition-colors mb-12 shadow-sm">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Click here if download didn't start</span>
        </a>


    </main>

    <!-- Hidden iframe to trigger automatic download -->
    <iframe id="download-frame" style="display:none;"></iframe>

    <script>
        // Trigger download automatically on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const frame = document.getElementById('download-frame');
                if (frame) {
                    frame.src = 'https://github.com/CilamAI/CilamAI/releases/latest/download/CilamAI-Setup.exe';
                }
            }, 800);
        });

        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-sun')?.classList.remove('hidden');
                document.getElementById('theme-moon')?.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-sun')?.classList.add('hidden');
                document.getElementById('theme-moon')?.classList.remove('hidden');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('cilamai-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
            applyTheme(isDark);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('cilamai-theme', newTheme);
            applyTheme(!isDark);
        }

        initTheme();
    </script>
</body>
</html>
