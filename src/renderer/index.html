<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OlinaAI</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title">
        <img src="./favicon.ico" alt="" class="titlebar-icon" />
        <span>OlinaAI</span>
      </span>
      <nav class="titlebar-menu">
        <div class="tb-menu-item" data-menu="file">
          <span>File</span>
          <div class="tb-menu-dropdown">
            <button type="button" data-action="upload">Upload</button>
          </div>
        </div>
        <div class="tb-menu-item" data-menu="view">
          <span>View</span>
          <div class="tb-menu-dropdown">
            <button type="button" data-action="settings">Settings</button>
            <button type="button" data-action="new-chat">New Chat</button>
            <div class="tb-submenu">
              <button type="button" class="tb-submenu-toggle">Model
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <div class="tb-submenu-menu"></div>
            </div>
          </div>
        </div>
        <div class="tb-menu-item" data-menu="window">
          <span>Window</span>
          <div class="tb-menu-dropdown">
            <button type="button" data-action="minimize">Minimize</button>
            <button type="button" data-action="maximize">Maximize</button>
            <button type="button" data-action="restore">Restore</button>
            <hr />
            <button type="button" data-action="close">Close</button>
          </div>
        </div>
      </nav>
      <div class="titlebar-controls">
        <button type="button" class="tb-btn" data-win-min aria-label="Minimize">
          <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="0.5" y1="5" x2="9.5" y2="5"/>
          </svg>
        </button>
        <button type="button" class="tb-btn" data-win-max aria-label="Maximize">
          <svg class="tb-max" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="0.5" y="0.5" width="9" height="9" rx="1"/>
          </svg>
          <svg class="tb-restore" viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" hidden>
            <path d="M3 3h6.5v6.5H3z"/>
            <path d="M7 3V1.5H1v6H2.5"/>
          </svg>
        </button>
        <button type="button" class="tb-btn tb-close" data-win-close aria-label="Close">
          <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="0.5" y1="0.5" x2="9.5" y2="9.5"/>
            <line x1="9.5" y1="0.5" x2="0.5" y2="9.5"/>
          </svg>
        </button>
      </div>
    </div>

    <nav class="icon-rail" aria-label="Navigation">
      <button class="rail-btn" data-view="chat" data-reset="true" aria-label="New Chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
      <button class="rail-btn" data-view="chat" aria-label="Launch">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </button>
      <button class="rail-btn" data-view="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0 .33-1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </button>
    </nav>

    <main class="main">
      <h1 class="welcome-text">How can I help you today?</h1>

      <div class="chat"></div>

      <form class="composer">
        <div class="composer-files" hidden></div>
        <input type="text" placeholder="Send a message" class="composer-input" />
        <div class="composer-actions">
          <button type="button" class="composer-btn upload" aria-label="Upload" data-upload>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <div class="model-select">
            <button type="button" class="model-select-btn" aria-label="Model" data-model-toggle>
              <span class="model-name">gemma4:26b</span>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div class="model-menu" hidden>
              <div class="model-options">
                <button type="button" class="model-option">gemma4:26b</button>
              </div>
            </div>
          </div>
          <button type="submit" class="composer-btn send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <path d="m5 12 7-7 7 7"/>
            </svg>
          </button>
          <button type="button" class="composer-btn stop" aria-label="Stop" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
          </button>
        </div>
      </form>

      <section class="settings-view" hidden>
        <h2>Settings</h2>
        <div class="setting-field">
          <span>Theme</span>
          <div class="theme-options">
            <label class="theme-card">
              <input type="radio" name="theme" value="dark" />
              <svg viewBox="0 0 96 60" class="theme-preview" aria-hidden="true">
                <rect width="96" height="60" rx="8" fill="#121212"/>
                <rect x="4" y="4" width="22" height="52" rx="6" fill="#1c1c1c"/>
                <rect x="8" y="10" width="14" height="5" rx="2.5" fill="#2a2a2a"/>
                <rect x="8" y="20" width="14" height="5" rx="2.5" fill="#2a2a2a"/>
                <rect x="30" y="10" width="38" height="7" rx="3.5" fill="#2a2a2a"/>
                <rect x="30" y="24" width="60" height="12" rx="6" fill="#2a2a2a"/>
                <circle cx="86" cy="48" r="4" fill="#f0f0f0"/>
              </svg>
              <span>Dark</span>
            </label>
            <label class="theme-card">
              <input type="radio" name="theme" value="system" />
              <svg viewBox="0 0 96 60" class="theme-preview" aria-hidden="true">
                <rect width="48" height="60" x="0" rx="8" fill="#ffffff"/>
                <rect width="48" height="60" x="48" fill="#121212"/>
                <rect x="4" y="4" width="22" height="52" rx="6" fill="#f2f2f2"/>
                <rect x="52" y="4" width="22" height="52" rx="6" fill="#1c1c1c"/>
                <rect x="30" y="10" width="14" height="7" rx="3.5" fill="#e6e6e6"/>
                <rect x="30" y="24" width="14" height="12" rx="6" fill="#e6e6e6"/>
                <rect x="78" y="10" width="14" height="7" rx="3.5" fill="#2a2a2a"/>
                <rect x="78" y="24" width="14" height="12" rx="6" fill="#2a2a2a"/>
                <circle cx="86" cy="48" r="4" fill="#121212"/>
              </svg>
              <span>System</span>
            </label>
            <label class="theme-card">
              <input type="radio" name="theme" value="light" />
              <svg viewBox="0 0 96 60" class="theme-preview" aria-hidden="true">
                <rect width="96" height="60" rx="8" fill="#ffffff"/>
                <rect x="4" y="4" width="22" height="52" rx="6" fill="#f2f2f2"/>
                <rect x="8" y="10" width="14" height="5" rx="2.5" fill="#e6e6e6"/>
                <rect x="8" y="20" width="14" height="5" rx="2.5" fill="#e6e6e6"/>
                <rect x="30" y="10" width="38" height="7" rx="3.5" fill="#e6e6e6"/>
                <rect x="30" y="24" width="60" height="12" rx="6" fill="#e6e6e6"/>
                <circle cx="86" cy="48" r="4" fill="#111111"/>
              </svg>
              <span>Light</span>
            </label>
            <label class="theme-card">
              <input type="radio" name="theme" value="blue" />
              <svg viewBox="0 0 96 60" class="theme-preview" aria-hidden="true">
                <rect width="96" height="60" rx="8" fill="#0d1524"/>
                <rect x="4" y="4" width="22" height="52" rx="6" fill="#16233c"/>
                <rect x="8" y="10" width="14" height="5" rx="2.5" fill="#223252"/>
                <rect x="8" y="20" width="14" height="5" rx="2.5" fill="#223252"/>
                <rect x="30" y="10" width="38" height="7" rx="3.5" fill="#223252"/>
                <rect x="30" y="24" width="60" height="12" rx="6" fill="#223252"/>
                <circle cx="86" cy="48" r="4" fill="#4d9fff"/>
              </svg>
              <span>Blue</span>
            </label>
            <label class="theme-card">
              <input type="radio" name="theme" value="red" />
              <svg viewBox="0 0 96 60" class="theme-preview" aria-hidden="true">
                <rect width="96" height="60" rx="8" fill="#1c0d0d"/>
                <rect x="4" y="4" width="22" height="52" rx="6" fill="#331616"/>
                <rect x="8" y="10" width="14" height="5" rx="2.5" fill="#4a2020"/>
                <rect x="8" y="20" width="14" height="5" rx="2.5" fill="#4a2020"/>
                <rect x="30" y="10" width="38" height="7" rx="3.5" fill="#4a2020"/>
                <rect x="30" y="24" width="60" height="12" rx="6" fill="#4a2020"/>
                <circle cx="86" cy="48" r="4" fill="#ff5a5a"/>
              </svg>
              <span>Red</span>
            </label>
            <label class="theme-card">
              <input type="radio" name="theme" value="yellow" />
              <svg viewBox="0 0 96 60" class="theme-preview" aria-hidden="true">
                <rect width="96" height="60" rx="8" fill="#171407"/>
                <rect x="4" y="4" width="22" height="52" rx="6" fill="#2b250e"/>
                <rect x="8" y="10" width="14" height="5" rx="2.5" fill="#3f3618"/>
                <rect x="8" y="20" width="14" height="5" rx="2.5" fill="#3f3618"/>
                <rect x="30" y="10" width="38" height="7" rx="3.5" fill="#3f3618"/>
                <rect x="30" y="24" width="60" height="12" rx="6" fill="#3f3618"/>
                <circle cx="86" cy="48" r="4" fill="#f5c518"/>
              </svg>
              <span>Yellow</span>
            </label>
          </div>
        </div>
        <hr class="setting-divider" />
        <div class="setting-field">
          <h3 class="setting-section">Startup</h3>
          <label class="setting-check">
            <input type="checkbox" id="startup-launch" />
            <span class="switch" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span>Launch on startup</span>
          </label>
        </div>
        <hr class="setting-divider" />
        <div class="setting-field">
          <h3 class="setting-section">Font</h3>
          <div class="setting-row">
            <span>Chat text size</span>
            <div class="font-select">
              <button type="button" class="font-select-btn" id="font-select-toggle">
                <span id="font-select-label">Default (14px)</span>
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m6 9 6 6 6-6"/>
                </svg>
              </button>
              <div class="font-select-menu" hidden>
                <button type="button" class="font-option" data-font-size="13">Small (13px)</button>
                <button type="button" class="font-option" data-font-size="14">Default (14px)</button>
                <button type="button" class="font-option" data-font-size="15">Large (15px)</button>
                <button type="button" class="font-option" data-font-size="17">Extra large (17px)</button>
              </div>
            </div>
          </div>
        </div>
        <hr class="setting-divider" />
        <div class="setting-field">
          <h3 class="setting-section">Chat</h3>
          <div class="setting-rows">
            <label class="setting-check">
              <input type="checkbox" id="chat-stream" />
              <span class="switch" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span>Stream responses</span>
            </label>
            <button type="button" class="setting-btn" id="clear-chat">Clear conversation</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>

    <div class="startup-loading" id="startup-loading"></div>

    <div class="notification" role="alert" hidden></div>
  </body>
</html>
