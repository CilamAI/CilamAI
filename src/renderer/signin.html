<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - CilamAI</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    :root {
      --bg: #0f1015;
      --text: #e7e7e7;
      --text-dim: #8a8a8a;
      --border: #2d2d2d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0f1015;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }

    .titlebar {
      height: 32px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      -webkit-app-region: drag;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #0f1015;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .close-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .close-btn:hover {
      background: #c42b1c;
      color: #ffffff;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
      gap: 20px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      opacity: 0.9;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0;
    }

    .providers {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
    }

    .provider-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .provider-primary {
      background: #303030;
      border: 1px solid #444;
      color: #fff;
    }

    .provider-primary:hover {
      background: #3a3a3a;
    }

    .provider-outline {
      background: transparent;
      border: 1px solid #444;
      color: var(--text);
    }

    .provider-outline:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .signup {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .signup a {
      color: var(--text);
      text-decoration: none;
      margin-left: 4px;
    }

    .signup a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <img src="./favicon.ico" width="14" height="14" alt="" />
      <span>CilamAI</span>
    </div>
    <div class="titlebar-right">
      <button class="close-btn" id="close-btn" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2">
          <line x1="0" y1="0" x2="10" y2="10" />
          <line x1="10" y1="0" x2="0" y2="10" />
        </svg>
      </button>
    </div>
  </div>

  <div class="content">
    <img src="./favicon.ico" alt="CilamAI" class="logo" width="56" height="56" />
    <h1 class="title">Sign in to CilamAI</h1>

    <div class="providers">
      <button type="button" class="provider-btn provider-primary" id="google-btn">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span>Continue with Google</span>
      </button>
      <button type="button" class="provider-btn provider-outline" id="skip-btn">
        <span>Sign in another way</span>
      </button>
    </div>

    <p class="signup">
      Don't have an account?
      <a href="#" id="signup-link">Sign up</a>
    </p>
  </div>

  <script type="module">
    document.querySelector('#close-btn')?.addEventListener('click', () => {
      window.electron?.closeWindow?.() || window.close()
    })

    document.querySelector('#skip-btn')?.addEventListener('click', () => {
      window.electron?.closeWindow?.() || window.close()
    })

    document.querySelector('#google-btn')?.addEventListener('click', async () => {
      if (window.electron?.signIn) {
        const result = await window.electron.signIn('google')
        if (result?.ok) {
          window.electron.closeWindow?.() || window.close()
        }
      }
    })

    document.querySelector('#signup-link')?.addEventListener('click', (e) => {
      e.preventDefault()
      window.electron?.openExternal?.('https://github.com/CilamAI/CilamAI')
    })
  </script>
</body>
</html>
