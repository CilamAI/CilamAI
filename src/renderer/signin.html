<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - CilamAI</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    :root {
      --bg: #171717;
      --text: #ffffff;
      --text-dim: #acacac;
      --border: #424242;
      --btn-bg: #f5f5f5;
      --btn-border: #d0d0d0;
      --btn-hover: #e8e8e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #171717;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }

    .titlebar {
      height: 32px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      -webkit-app-region: drag;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #171717;
      -webkit-font-smoothing: antialiased;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .close-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .close-btn:hover {
      background: #c42b1c;
      color: #ffffff;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
      gap: 20px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      opacity: 0.9;
    }

    .title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin: 0;
    }

    .providers {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
    }

    .provider-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .provider-primary {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #1a1a1a;
    }

    .provider-primary:hover {
      background: var(--btn-hover);
    }

    .provider-outline {
      background: transparent;
      border: 1px solid #555;
      color: var(--text);
    }

    .provider-outline:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .signup-link {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .signup-link:hover {
      color: var(--text);
    }

    .waiting { display: none; }
    .waiting.active { display: flex; }
    .waiting-text { font-size: 15px; color: #acacac; margin-bottom: 16px; }

    .startup-loading {
      position: fixed;
      top: 32px;
      right: 0;
      bottom: 0;
      left: 0;
      background: #171717;
      z-index: 300;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.4s ease;
    }
    .startup-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .md-spinner {
      transform-origin: center;
      animation: md-spinner-rotate 1.5s linear infinite;
    }
    .md-spinner circle {
      fill: none;
      stroke-width: 4;
    }
    .md-spinner-track {
      stroke: rgba(255, 255, 255, 0.15);
    }
    .md-spinner-indeterminate {
      stroke: #e0e0e0;
      stroke-linecap: round;
      stroke-dasharray: 90 150;
      animation: md-spinner-dash 1.5s ease-in-out infinite;
    }
    @keyframes md-spinner-rotate {
      100% { transform: rotate(360deg); }
    }
    @keyframes md-spinner-dash {
      0% { stroke-dasharray: 1 200; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 100 200; stroke-dashoffset: -15; }
      100% { stroke-dasharray: 100 200; stroke-dashoffset: -120; }
    }
  </style>
</head>
<body>
  <div class="startup-loading" id="startup-loading">
    <svg class="md-spinner" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
      <circle class="md-spinner-track" cx="24" cy="24" r="20" />
      <circle class="md-spinner-indeterminate" cx="24" cy="24" r="20" />
    </svg>
  </div>

  <div class="titlebar">
    <div class="titlebar-left">
      <img src="./favicon.ico" width="14" height="14" alt="" />
      <span>CilamAI</span>
    </div>
    <div class="titlebar-right">
      <button class="close-btn" id="close-btn" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2">
          <line x1="0" y1="0" x2="10" y2="10" />
          <line x1="10" y1="0" x2="0" y2="10" />
        </svg>
      </button>
    </div>
  </div>

  <div class="content" id="signin-panel">
    <svg viewBox="0 0 48 48" width="48" height="48" style="margin-bottom: 4px;">
      <path fill="#ffffff" d="M24 2L28.5 19.5L46 24L28.5 28.5L24 46L19.5 28.5L2 24L19.5 19.5Z"/>
    </svg>
    <h1 class="title">Sign in to CilamAI</h1>

    <div class="providers">
      <button type="button" class="provider-btn provider-primary" id="google-btn">
        <svg viewBox="0 0 48 48" width="18" height="18">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        <span>Continue to sign in</span>
      </button>
      <button type="button" class="provider-btn provider-outline" id="github-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#ffffff">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>Continue with GitHub</span>
      </button>
    </div>
    <a href="#" class="signup-link" id="signup-btn" title="Sign up">Sign up</a>
  </div>

  <div class="content waiting" id="waiting-panel">
    <svg viewBox="0 0 48 48" width="48" height="48" style="margin-bottom: 4px;">
      <path fill="#ffffff" d="M24 2L28.5 19.5L46 24L28.5 28.5L24 46L19.5 28.5L2 24L19.5 19.5Z"/>
    </svg>
    <p class="waiting-text">Continue signing in with your browser</p>
    <div class="providers">
      <button type="button" class="provider-btn provider-outline" id="cancel-signin-btn">Cancel sign-in</button>
    </div>
  </div>

  <script type="module">
    const startupEl = document.getElementById('startup-loading')
    setTimeout(() => { startupEl?.classList.add('fade-out') }, 2000)

    const MAIN_APP = './index.html'

    function goToApp() {
      window.location.href = MAIN_APP
    }

    async function checkExistingUser() {
      try {
        const user = await window.electron?.getUser?.()
        if (user && (user.name || user.email)) {
          localStorage.setItem('cilamai-user', JSON.stringify(user))
          goToApp()
          return true
        }
      } catch {}
      return false
    }

    if (await checkExistingUser()) {
      // already signed in — navigated to index.html
    } else {
      const signinPanel = document.getElementById('signin-panel')
      const waitingPanel = document.getElementById('waiting-panel')

      document.querySelector('#close-btn')?.addEventListener('click', () => {
        window.electron?.closeWindow?.() || window.close()
      })

      document.querySelector('#signup-btn')?.addEventListener('click', (e) => {
        e.preventDefault()
        // Defaulting to GitHub sign in for now as it's the primary provider
        document.querySelector('#github-btn')?.click()
      })

      document.querySelector('#skip-btn')?.addEventListener('click', () => {
        goToApp()
      })

      document.querySelector('#google-btn')?.addEventListener('click', async () => {
        if (window.electron?.signIn) {
          signinPanel.style.display = 'none'
          waitingPanel.classList.add('active')
          const result = await window.electron.signIn('google')
          if (result?.ok && result.user) {
            localStorage.setItem('cilamai-user', JSON.stringify(result.user))
            window.electron?.setUser?.(result.user)
            goToApp()
          } else {
            waitingPanel.classList.remove('active')
            signinPanel.style.display = ''
          }
        }
      })

      document.querySelector('#github-btn')?.addEventListener('click', async () => {
        if (window.electron?.signIn) {
          signinPanel.style.display = 'none'
          waitingPanel.classList.add('active')
          const result = await window.electron.signIn('github')
          if (result?.ok && result.user) {
            localStorage.setItem('cilamai-user', JSON.stringify(result.user))
            window.electron?.setUser?.(result.user)
            goToApp()
          } else {
            waitingPanel.classList.remove('active')
            signinPanel.style.display = ''
          }
        }
      })

      document.querySelector('#cancel-signin-btn')?.addEventListener('click', () => {
        waitingPanel.classList.remove('active')
        signinPanel.style.display = ''
      })
    }
  </script>
</body>
</html>
