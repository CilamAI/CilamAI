name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior in CilamAI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and fix it.
  - type: input
    id: version
    attributes:
      label: CilamAI Version
      description: What version of CilamAI are you running? (e.g. 0.1.0.1)
      placeholder: "v0.1.0.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Select your operating system
      options:
        - Windows 11
        - Windows 10
        - Windows (Other)
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Open CilamAI
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should happen...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Output
      description: Paste any error messages, devtools logs, or terminal outputs.
      render: shell
